<!doctype html><html><head><meta charset="utf-8"><title>Embedding lifecycle QA</title></head><body><p>开发测试：向实际课堂文档分发受控 visibilitychange，验证其监听流程。此测试不等于真实操作系统切换标签页。</p><button id="hide">模拟文档隐藏事件</button><button id="show">模拟文档恢复事件</button><output id="status"></output><iframe title="课堂运行测试" src="/learn/embedding/" style="display:block;width:100%;height:820px;border:0"></iframe><script>
const frame=document.querySelector('iframe'),out=document.querySelector('output');
function change(hidden){const doc=frame.contentDocument;Object.defineProperty(doc,'hidden',{configurable:true,get:()=>hidden});doc.dispatchEvent(new Event('visibilitychange'));out.textContent=`hidden=${hidden}; playing=${doc.querySelector('#play').getAttribute('aria-pressed')}; time=${doc.querySelector('#time').textContent}; config=${doc.querySelector('.controls').getAttribute('aria-hidden')}`;}
document.querySelector('#hide').onclick=()=>change(true);document.querySelector('#show').onclick=()=>change(false);
</script></body></html>
